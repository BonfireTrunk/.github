name: maven-release

# Reusable release for BonfireTrunk Maven libraries, called from each library's
# release.yml on every push to prime and on manual runs.
# When a release PR titled "Release X.Y.Z" is merged into prime, the library is
# built and signed once, published to GitHub Packages, tagged vX.Y.Z with a
# GitHub release, and then uploaded to Maven Central. Within a run, both
# registries receive the same signed files. When a PR titled "Snapshot: ..." is
# merged, the -SNAPSHOT version on prime is published to GitHub Packages, where
# other libraries' pull request builds can use it. Any other push shows up as a
# skipped run and never starts a runner. A release resolves from Maven Central
# alone and refuses SNAPSHOT dependencies, so it never needs anything users
# cannot get.
# To retry or finish a release, re-run its failed job, or run the library's
# release workflow by hand (Actions > release > Run workflow) on prime or on the
# tag vX.Y.Z. Whatever already happened is skipped: a registry that has the
# version, and the tag when it already points at the commit being released.
on:
  workflow_call:
    inputs:
      maven-args:
        description: Extra arguments for the publishing build, such as a switch that skips tests needing services the runner lacks
        type: string
        default: ''
    secrets:
      CENTRAL_USERNAME:
        required: true
      CENTRAL_TOKEN:
        required: true
      MAVEN_GPG_KEY:
        required: true
      MAVEN_GPG_PASSPHRASE:
        required: true

permissions: {}

jobs:
  release:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/prime' &&
       startsWith(github.event.head_commit.message, 'Release ')) ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/prime' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check version, tag, changelog and registries
        id: check
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(./mvnw -B -q org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate -Dexpression=project.version -DforceStdout)
          echo "pom version: $version"

          case "$version" in
            *-SNAPSHOT) echo "::error::$version is a SNAPSHOT, nothing to release. To finish an earlier release, run this workflow on its tag."; exit 1 ;;
          esac

          if [ "$EVENT" = push ]; then
            title=${MESSAGE%%$'\n'*}
            title=${title% (#*)}  # GitHub appends " (#123)" to squash-merge titles
            if [ "$title" != "Release $version" ]; then
              echo "::error::Commit title '$title' does not match pom version $version"; exit 1
            fi
          fi

          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pom version $version"; exit 1
          fi

          if ! ./mvnw -B -ntp -q org.apache.maven.plugins:maven-enforcer-plugin:3.6.3:enforce -Denforcer.rules=requireReleaseDeps; then
            echo "::error::$version depends on a SNAPSHOT; release that dependency to Maven Central and depend on the release first"; exit 1
          fi

          # An annotated tag is listed twice, the second time as ^{} with the commit it
          # points at; that line sorts last. A lightweight tag is listed once, with its commit.
          tag_commit=$(git ls-remote --tags origin "refs/tags/v$version" "refs/tags/v$version^{}" | sort -k2 | tail -n1 | cut -f1)
          if [ -z "$tag_commit" ]; then
            tagged=false
          elif [ "$tag_commit" = "$GITHUB_SHA" ]; then
            echo "Tag v$version already points at this commit, skipping the tag and GitHub release"; tagged=true
          else
            echo "::error::Tag v$version already exists on another commit ($tag_commit)"; exit 1
          fi

          awk -v h="## [$version]" 'index($0, h) == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no entries under ## [$version]"; exit 1
          fi

          artifact=$(./mvnw -B -q org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate -Dexpression=project.artifactId -DforceStdout)

          # Every published module is checked, not only the root: GitHub Packages
          # receives modules one at a time, and a retry after a deploy that stopped
          # partway must not take the root's presence to mean all of them are there.
          # A module stays out of a registry through the same properties the build
          # honours: maven.deploy.skip for GitHub Packages, skipPublishing for Central.
          ./mvnw -B -q -Ppublish org.apache.maven.plugins:maven-help-plugin:3.5.2:effective-pom -Doutput="$RUNNER_TEMP/effective-pom.xml"
          python3 - "$RUNNER_TEMP/effective-pom.xml" > "$RUNNER_TEMP/modules.txt" <<'PY'
          import sys, xml.etree.ElementTree as ET
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          root = ET.parse(sys.argv[1]).getroot()
          # A single-module build writes one <project>; a reactor wraps them in <projects>.
          for p in root.findall('m:project', ns) or [root]:
              props = p.find('m:properties', ns)
              def skipped(name):
                  return props is not None and props.findtext('m:' + name, namespaces=ns) == 'true'
              print(p.findtext('m:groupId', namespaces=ns), p.findtext('m:artifactId', namespaces=ns),
                    'no' if skipped('maven.deploy.skip') else 'yes',
                    'no' if skipped('skipPublishing') else 'yes')
          PY

          central_have=(); central_missing=(); github_have=(); github_missing=()
          while read -r group module to_github to_central; do
            if [ "$to_central" = yes ]; then
              pom_url="https://repo1.maven.org/maven2/${group//.//}/$module/$version/$module-$version.pom"
              status=$(curl -sS -o /dev/null -w '%{http_code}' "$pom_url")
              case "$status" in
                200) central_have+=("$module") ;;
                404) central_missing+=("$module") ;;
                *) echo "::error::Could not check Maven Central, $pom_url returned $status"; exit 1 ;;
              esac
            fi
            if [ "$to_github" = yes ]; then
              versions_url="https://api.github.com/orgs/$GITHUB_REPOSITORY_OWNER/packages/maven/$group.$module/versions?per_page=100"
              status=$(curl -sS -o "$RUNNER_TEMP/versions.json" -w '%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$versions_url")
              case "$status" in
                200) if jq -e --arg v "$version" 'any(.[]; .name == $v)' "$RUNNER_TEMP/versions.json" > /dev/null; then
                       github_have+=("$module")
                     else
                       github_missing+=("$module")
                     fi ;;
                404) github_missing+=("$module") ;;
                *) echo "::error::Could not check GitHub Packages, $versions_url returned $status"; exit 1 ;;
              esac
            fi
          done < "$RUNNER_TEMP/modules.txt"

          if [ ${#central_missing[@]} -eq 0 ]; then
            echo "$version is already on Maven Central, skipping that upload"; central=true
          elif [ ${#central_have[@]} -eq 0 ]; then
            central=false
          else
            # One upload carries every module, but they can reach repo1 at different times.
            echo "::error::Maven Central has $version of ${central_have[*]} but not of ${central_missing[*]}. If the upload was recent, Central may still be publishing it: check the deployment in the Central Portal and run this workflow again once it shows as published."; exit 1
          fi

          if [ ${#github_missing[@]} -eq 0 ]; then
            echo "$version is already on GitHub Packages, skipping that upload"; github=true
          elif [ ${#github_have[@]} -eq 0 ]; then
            github=false
          else
            echo "::error::GitHub Packages has $version of ${github_have[*]} but not of ${github_missing[*]}, so an earlier deploy stopped partway. Delete version $version from the packages that have it, then run this workflow again."; exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "tagged=$tagged" >> "$GITHUB_OUTPUT"
          echo "central=$central" >> "$GITHUB_OUTPUT"
          echo "github=$github" >> "$GITHUB_OUTPUT"

      - name: Build, sign and publish to GitHub Packages
        if: steps.check.outputs.central == 'false' || steps.check.outputs.github == 'false'
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          GITHUB_TOKEN: ${{ github.token }}
          CENTRAL_DONE: ${{ steps.check.outputs.central }}
          GITHUB_DONE: ${{ steps.check.outputs.github }}
          ARGS: ${{ inputs.maven-args }}
        run: |
          cat > "$RUNNER_TEMP/settings.xml" <<'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

          # verify builds and signs once, and Maven stops at the first goal that fails.
          # The Central goal only bundles the signed files; the bundle is uploaded after
          # the tag exists, so Central never gets a version that GitHub Packages lacks.
          goals=verify
          [ "$GITHUB_DONE" = false ] && goals="$goals deploy:deploy -DaltDeploymentRepository=github::https://maven.pkg.github.com/$GITHUB_REPOSITORY"
          [ "$CENTRAL_DONE" = false ] && goals="$goals org.sonatype.central:central-publishing-maven-plugin:publish -DskipUpload=true"

          ./mvnw -B -ntp -s "$RUNNER_TEMP/settings.xml" -Ppublish -Dgpg.signer=bc $ARGS $goals

      - name: Tag and create the GitHub release
        if: steps.check.outputs.tagged == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.check.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Upload to Maven Central
        if: steps.check.outputs.central == 'false'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
          ARTIFACT: ${{ steps.check.outputs.artifact }}
        run: |
          auth=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          api=https://central.sonatype.com/api/v1/publisher

          # AUTOMATIC publishes as soon as validation passes, with no manual step in the Portal.
          if ! id=$(curl -sS --fail-with-body -X POST -H "Authorization: Bearer $auth" \
              --url-query publishingType=AUTOMATIC --url-query "name=$ARTIFACT $VERSION" \
              -F "bundle=@target/central-publishing/central-bundle.zip;type=application/octet-stream" \
              "$api/upload"); then
            echo "::error::Maven Central refused the upload: $id"; exit 1
          fi
          echo "Central deployment $id"

          # Stop at validation. Copying a validated release to Maven Central can take
          # 30 minutes or more and needs nothing from this runner.
          deadline=$((SECONDS + 3600))
          while :; do
            sleep 10
            if ! status=$(curl -sS --fail-with-body -X POST -H "Authorization: Bearer $auth" \
                --url-query "id=$id" "$api/status"); then
              echo "::error::Could not read the status of Central deployment $id: $status"; exit 1
            fi
            state=$(jq -r .deploymentState <<< "$status")
            case "$state" in
              VALIDATED|PUBLISHING|PUBLISHED)
                echo "Central validated $VERSION ($state). It appears on Maven Central when publishing finishes."; break ;;
              FAILED)
                echo "::error::Maven Central rejected $VERSION"; jq '.errors' <<< "$status"; exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Central deployment $id was still $state after an hour"; exit 1
            fi
          done

  snapshot:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/prime' &&
      startsWith(github.event.head_commit.message, 'Snapshot:')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and publish the snapshot to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARGS: ${{ inputs.maven-args }}
        run: |
          version=$(./mvnw -B -q org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate -Dexpression=project.version -DforceStdout)
          case "$version" in
            *-SNAPSHOT) ;;
            *) echo "::error::The title asks for a snapshot, but the pom version $version is not a SNAPSHOT"; exit 1 ;;
          esac

          # The same resolution as maven-build.yml, so a snapshot that depends on
          # another library's snapshot builds here too.
          cat > "$RUNNER_TEMP/settings.xml" <<'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-packages</id>
                <repositories>
                  <repository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                    <snapshots>
                      <enabled>false</enabled>
                    </snapshots>
                  </repository>
                  <repository>
                    <id>github</id>
                    <url>https://maven.pkg.github.com/${env.GITHUB_REPOSITORY_OWNER}/*</url>
                    <snapshots>
                      <enabled>true</enabled>
                      <updatePolicy>always</updatePolicy>
                    </snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github-packages</activeProfile>
            </activeProfiles>
          </settings>
          EOF
          mkdir -p "$RUNNER_TEMP/rrf"
          echo today.bonfire.oss > "$RUNNER_TEMP/rrf/groupId-github.txt"

          ./mvnw -B -ntp -s "$RUNNER_TEMP/settings.xml" \
            -Daether.remoteRepositoryFilter.groupId=true \
            -Daether.remoteRepositoryFilter.groupId.basedir="$RUNNER_TEMP/rrf" \
            $ARGS verify deploy:deploy \
            -DaltDeploymentRepository=github::https://maven.pkg.github.com/$GITHUB_REPOSITORY
