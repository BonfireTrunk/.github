name: rust-build

# Reusable build for one-root-crate Rust libraries. It intentionally exposes no
# secrets and uses a read-only token so pull-request code cannot publish.
on:
  workflow_call:
    inputs:
      toolchain:
        description: Rust toolchain used to test the crate
        type: string
        default: stable

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        env:
          RUST_TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          if ! printf '%s' "$RUST_TOOLCHAIN" | grep -Eq '^(stable|beta|nightly)(-[0-9]{4}-[0-9]{2}-[0-9]{2})?$|^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::toolchain must be stable, beta, nightly, a dated channel, or a Rust version such as 1.85.0"
            exit 1
          fi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"

      - name: Test
        run: cargo test --locked
