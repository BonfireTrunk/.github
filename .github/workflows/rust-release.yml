                  source = packed[0]
                  shutil.copyfile(source, dest / "package.tgz")
                  with tarfile.open(source, "r:gz") as tar:
                      package = json.loads(tar.extractfile("package/package.json").read())
                  require(package["name"] == metadata["name"] and package["version"] == metadata["version"], "Packaged npm identity changed during build")
                  check_npm_repository(package)
                  require(not package.get("publishConfig") or package["publishConfig"] == {"access": "public"}, "Packaged publishConfig overrides release policy")
              elif kind == "rust":
                  archive = Path("target/package") / (metadata["name"] + "-" + metadata["version"] + ".crate")
                  package, payload = crate_payload(archive)
                  require(package["name"] == metadata["name"] and package["vers"] == metadata["version"], "Packaged crate identity changed during build")
                  shutil.copyfile(archive, dest / "package.crate")
                  (dest / "upload.bin").write_bytes(payload)
              metadata["files"] = {p.name: digest(p) for p in dest.iterdir() if p.name != "metadata.json"}
              if os.environ.get("RELEASE_ASSETS") == "true":
                  # Only digests are sealed; the files travel beside the bundle so the release does not store them twice.
                  metadata["assets"] = asset_files(Path(os.environ["RUNNER_TEMP"]) / "release-assets", kind)
              write_json(dest / "metadata.json", metadata)
              check_bundle(dest, kind, metadata["sha"], metadata["version"])
              archive = dest.parent / ("release-" + kind + ".zip")
              with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as zipped:
                  for path in sorted(dest.iterdir()):
                      zipped.write(path, path.name)


          if __name__ == "__main__":
              bundle()
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: archive
        with:
          name: release-rust-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-rust.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.release-environment }}
    permissions:
      contents: write
      id-token: write
    env:
      KIND: rust
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/incoming
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish verified artifacts in order
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          """Shared source embedded by render.py into reusable workflows."""
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tarfile
          import time
          import tomllib
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile


          def require(condition, message):
              if not condition:
                  raise ValueError(message)


          def version(value, shorthand=False):
              if shorthand and re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", value):
                  value += ".0"
              pattern = r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?"
              match = re.fullmatch(pattern, value)
              require(match is not None, "Use X.Y.Z or X.Y.Z-prerelease; title shorthand X.Y is allowed. Build metadata is not supported.")
              for part in (match[4] or "").split("."):
                  require(not (part.isdigit() and len(part) > 1 and part.startswith("0")), "Prerelease numbers cannot have leading zeros")
              return value


          def release_title(title):
              title = re.sub(r" \(#\d+\)$", "", title.splitlines()[0])
              require(title.startswith("Release "), "Expected a squash-merge commit titled Release X.Y.Z")
              return version(title[len("Release "):], shorthand=True)


          def version_key(value):
              version(value)
              core, separator, suffix = value.partition("-")
              parts = tuple((0, int(part)) if part.isdigit() else (1, part) for part in suffix.split(".")) if separator else ()
              return (*map(int, core.split(".")), not separator, parts)


          def check_npm_repository(package):
              repository = package.get("repository")
              url = repository.get("url") if isinstance(repository, dict) else repository
              expected = "https://github.com/" + os.environ["GITHUB_REPOSITORY"]
              require(url in {expected, expected + ".git", "git+" + expected + ".git"},
                      "package.json repository must identify this GitHub repository with its canonical HTTPS URL")
              require(not isinstance(repository, dict) or not repository.get("directory"), "Only a root npm package is supported")


          def run(*args, **kwargs):
              return subprocess.check_output(args, text=True, **kwargs).strip()


          def request(url, token=None, method="GET", data=None, missing=False, content_type="application/json", raw=False, detail=False):
              headers = {"Accept": "application/json", "User-Agent": "BonfireTrunk-release-workflows"}
              if token:
                  headers["Authorization"] = "Bearer " + token
              if data is not None:
                  headers["Content-Type"] = content_type
                  if not isinstance(data, bytes):
                      data = json.dumps(data).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      body = response.read()
                      return body if raw else json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  if missing and error.code == 404:
                      return None
                  reason = ""
                  if detail:
                      # Only for registries whose error bodies carry validation messages, never credentials.
                      try:
                          errors = json.loads(error.read()).get("errors", [])
                          reason = ": " + "; ".join(str(e.get("detail", "")) for e in errors)[:500]
                      except (ValueError, AttributeError):
                          pass
                  failure = RuntimeError(f"{method} {urllib.parse.urlsplit(url).hostname} returned HTTP {error.code}{reason}; check access and service status")
                  failure.status = error.code
                  raise failure from None


          def github(path, **kwargs):
              return request("https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + path,
                             token=os.environ.get("GH_TOKEN"), **kwargs)


          def tag_commit(tag):
              obj = github("/git/ref/tags/" + urllib.parse.quote(tag, safe=""), missing=True)
              if obj is None:
                  return None
              obj = obj["object"]
              for _ in range(5):
                  if obj["type"] == "commit":
                      return obj["sha"]
                  require(obj["type"] == "tag", "Release tag does not identify a commit")
                  obj = github("/git/tags/" + obj["sha"])["object"]
              raise ValueError("Too many nested annotated tags")


          def published_release(tag):
              """Published releases by tag; drafts are only listed to tokens with write access."""
              return github("/releases/tags/" + urllib.parse.quote(tag, safe=""), missing=True)


          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()


          def write_json(path, value):
              Path(path).write_text(json.dumps(value, indent=2) + "\n")


          def output(**values):
              with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
                  for key, value in values.items():
                      stream.write(f"{key}={value}\n")


          def check_asset_names(names, kind):
              for name in names:
                  # GitHub renames asset files with other characters, which would break download links.
                  require(re.fullmatch(r"[A-Za-z0-9](?:[A-Za-z0-9._-]*[A-Za-z0-9])?", name) and name.lower() != "release-" + kind + ".zip",
                          "Release asset names use letters, digits, '.', '_' and '-', start and end with a letter or digit, and cannot be release-" + kind + ".zip: " + name)
              require(len({name.lower() for name in names}) == len(names), "Release asset names must differ in more than letter case")


          def asset_files(directory, kind):
              paths = sorted(Path(directory).iterdir())
              require(paths, "assets-command left no files in RELEASE_ASSETS_DIR")
              for path in paths:
                  require(path.is_file() and not path.is_symlink(), "Release assets must be regular files directly in RELEASE_ASSETS_DIR: " + path.name)
              check_asset_names([path.name for path in paths], kind)
              return {path.name: digest(path) for path in paths}


          def check_bundle(directory, kind, sha, expected_version=None):
              metadata = json.loads((directory / "metadata.json").read_text())
              require(metadata["kind"] == kind and metadata["sha"] == sha, "Artifact belongs to another release commit or ecosystem")
              version(metadata["version"])
              if expected_version:
                  require(metadata["version"] == expected_version, "Artifact version differs from requested release")
              require(metadata["tag"] == "v" + metadata["version"], "Artifact tag mismatch")
              allowed = {"notes.md", "package.tgz", "package.crate", "upload.bin"}
              require(set(metadata["files"]).issubset(allowed), "Unexpected release artifact file")
              for name, sha256 in metadata["files"].items():
                  require(digest(directory / name) == sha256, "Release artifact checksum mismatch: " + name)
              expected = {"notes.md"} | ({"package.tgz"} if kind == "npm" else {"package.crate", "upload.bin"} if kind == "rust" else set())
              require(set(metadata["files"]) == expected, "Incomplete release bundle")
              check_asset_names(list(metadata.get("assets", {})), kind)
              return metadata

          import struct


          def npm_packument(metadata, registry, token=None):
              # GitHub Packages answers per-version and dist-tag paths with HTTP 405; both registries serve the full document.
              packument = request(registry + "/" + urllib.parse.quote(metadata["name"], safe=""), token=token, missing=True)
              if packument is not None:
                  require(packument.get("name") == metadata["name"], "Registry returned another package identity")
              return packument


          def registry_matches(metadata, registry, token=None):
              remote = (npm_packument(metadata, registry, token) or {}).get("versions", {}).get(metadata["version"])
              if remote is None:
                  return False
              require(remote.get("name") == metadata["name"] and remote.get("version") == metadata["version"], "Registry returned another package identity")
              integrity = remote.get("dist", {}).get("integrity", "")
              actual = "sha512-" + base64.b64encode(hashlib.sha512(Path("package.tgz").read_bytes()).digest()).decode()
              require(integrity == actual, "Existing registry version has different bytes or no SHA-512 integrity; refusing to overwrite or skip it")
              return True


          def check_npm_channel(metadata, registry, token=None):
              channel = "next" if "-" in metadata["version"] else "latest"
              current = (npm_packument(metadata, registry, token) or {}).get("dist-tags", {}).get(channel)
              if current:
                  require(version_key(metadata["version"]) >= version_key(current), "Publishing this version would move npm " + channel + " backwards")


          def npm_publish(metadata, registry, token=None):
              if registry_matches(metadata, registry, token):
                  return
              check_npm_channel(metadata, registry, token)
              env = os.environ.copy()
              config = Path(os.environ["RUNNER_TEMP"]) / "publish.npmrc"
              config.write_text(("//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n" if token else "") + "registry=" + registry + "\n")
              env["NPM_CONFIG_USERCONFIG"] = str(config)
              env["NPM_CONFIG_GLOBALCONFIG"] = str(config.parent / "empty-global.npmrc")
              env["NPM_CONFIG_CACHE"] = str(config.parent / "publish-cache")
              env.pop("NODE_AUTH_TOKEN", None)
              env.pop("NPM_TOKEN", None)
              if token:
                  env["NODE_AUTH_TOKEN"] = token
              channel = "next" if "-" in metadata["version"] else "latest"
              result = subprocess.run(["npm", "publish", "package.tgz", "--ignore-scripts", "--registry", registry,
                                       "--access", "public", "--tag", channel], env=env)
              # A lost response may follow an accepted upload. Reconcile before any retry;
              # npmjs.com lets its CDN serve a package document for up to five minutes.
              # A failed publish is almost always a real rejection, so report it sooner.
              attempts = 24 if result.returncode == 0 else 3
              for attempt in range(attempts):
                  if registry_matches(metadata, registry, token):
                      return
                  if attempt < attempts - 1:
                      time.sleep(15)
              raise RuntimeError(f"npm publish exit {result.returncode}; version not confirmed. Rerun this job after checking registry status.")


          def incoming_assets(directory, metadata, kind):
              """Asset files built by this run; a run restored from a published release has none."""
              if not metadata.get("assets") or not directory.exists():
                  return {}
              require(asset_files(directory, kind) == metadata["assets"], "Release asset files differ from the sealed bundle")
              return {name: directory / name for name in metadata["assets"]}


          def attach_asset(release, name, sha256, path, content_type="application/octet-stream"):
              assets = [a for a in release["assets"] if a["name"] == name]
              require(len(assets) <= 1, "Duplicate release assets named " + name)
              if assets and assets[0].get("digest") != "sha256:" + sha256:
                  # A draft is unpublished, so a rebuilt file may replace one left by an interrupted run.
                  require(release["draft"], "Existing GitHub release asset " + name + " differs; refusing to replace it")
                  github("/releases/assets/" + str(assets[0]["id"]), method="DELETE")
                  assets = []
              if not assets:
                  require(path is not None, "GitHub release lacks sealed asset " + name + " and this run has no copy; investigate the release")
                  upload = release["upload_url"].split("{", 1)[0] + "?name=" + urllib.parse.quote(name)
                  uploaded = request(upload, token=os.environ.get("GH_TOKEN"), method="POST", data=Path(path).read_bytes(), content_type=content_type)
                  require(uploaded.get("name") in (None, name), "GitHub renamed release asset " + name)
                  require(uploaded.get("digest") in (None, "sha256:" + sha256), "GitHub stored different bytes for release asset " + name)


          def ensure_github_release(metadata, archive, assets=None):
              commit = tag_commit(metadata["tag"])
              require(commit is None or commit == metadata["sha"], "Existing tag points at another commit")
              if commit is None:
                  github("/git/refs", method="POST", data={"ref": "refs/tags/" + metadata["tag"], "sha": metadata["sha"]})
              prerelease = "-" in metadata["version"]
              release = published_release(metadata["tag"])
              if release is None:
                  # Immutable releases reject assets once published, so attach the bundle to a draft first.
                  drafts = [r for r in github("/releases?per_page=100") if r["draft"] and r["tag_name"] == metadata["tag"]]
                  require(len(drafts) <= 1, "Several draft releases use this tag; delete the extra drafts")
                  release = drafts[0] if drafts else github("/releases", method="POST", data={
                      "tag_name": metadata["tag"], "target_commitish": metadata["sha"], "name": metadata["version"],
                      "body": Path("notes.md").read_text(), "prerelease": prerelease, "draft": True})
              require(release["prerelease"] == prerelease, "Existing GitHub release has incompatible prerelease state")
              sealed = metadata.get("assets")
              if release["draft"] and sealed:
                  # The published release must offer exactly the sealed files, not leftovers from an earlier build.
                  for stale in [a for a in release["assets"] if a["name"] not in {archive.name, *sealed}]:
                      github("/releases/assets/" + str(stale["id"]), method="DELETE")
              attach_asset(release, archive.name, digest(archive), archive, "application/zip")
              for name, sha256 in (sealed or {}).items():
                  attach_asset(release, name, sha256, (assets or {}).get(name))
              if release["draft"]:
                  github("/releases/" + str(release["id"]), method="PATCH",
                         data={"draft": False, "make_latest": "false" if prerelease else "legacy"})


          def cargo_matches(metadata):
              name = metadata["name"].lower()
              path = "1/" + name if len(name) == 1 else "2/" + name if len(name) == 2 else "3/" + name[0] + "/" + name if len(name) == 3 else name[:2] + "/" + name[2:4] + "/" + name
              req = urllib.request.Request("https://index.crates.io/" + path, headers={"User-Agent": "BonfireTrunk-release-workflows"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      entries = [json.loads(line) for line in response.read().splitlines()]
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return False
                  raise RuntimeError(f"crates.io index returned HTTP {error.code}") from None
              for entry in entries:
                  if entry["vers"] == metadata["version"]:
                      require(not entry.get("yanked"), "Existing crate version was yanked; refusing to treat it as published")
                      require(entry["cksum"] == digest("package.crate"), "Existing crate version has different bytes")
                      return True
              return False


          def cargo_publish(metadata):
              if cargo_matches(metadata):
                  return
              payload = Path("upload.bin").read_bytes()
              length = struct.unpack("<I", payload[:4])[0]
              info = json.loads(payload[4:4 + length])
              crate_length = struct.unpack("<I", payload[4 + length:8 + length])[0]
              require(info["name"] == metadata["name"] and info["vers"] == metadata["version"], "Cargo upload metadata mismatch")
              require(payload[8 + length:] == Path("package.crate").read_bytes() and crate_length == len(payload[8 + length:]), "Cargo upload does not contain the verified crate")
              error = None
              attempts = 12
              try:
                  result = request("https://crates.io/api/v1/crates/new", token=os.environ["CARGO_REGISTRY_TOKEN"],
                                   method="PUT", data=payload, content_type="application/octet-stream", detail=True)
                  require(not result.get("errors"), "crates.io rejected the upload: " + "; ".join(str(e.get("detail", "")) for e in result["errors"])[:500])
              except RuntimeError as exc:
                  error = str(exc)
                  print(error)
                  if 400 <= getattr(exc, "status", 0) < 500:
                      # crates.io rejected the request; a short check still catches an earlier accepted upload.
                      attempts = 2
              except (urllib.error.URLError, TimeoutError) as exc:
                  error = type(exc).__name__
              for attempt in range(attempts):
                  if cargo_matches(metadata):
                      return
                  if attempt < attempts - 1:
                      time.sleep(10)
              raise RuntimeError("Crate upload not confirmed in index" + (" after " + error if error else "") + "; inspect crates.io and rerun this job")


          def go_proxy_url(metadata, path):
              return "https://proxy.golang.org/" + re.sub(r"[A-Z]", lambda match: "!" + match[0].lower(), metadata["name"]) + "/@v/" + path


          def go_proxy_known(metadata):
              # The proxy documents that requesting a version before its tag exists can delay it by up to 30 minutes.
              listing = request(go_proxy_url(metadata, "list"), missing=True, raw=True)
              return listing is not None and metadata["tag"] in listing.decode().split()


          def go_proxy_info(metadata):
              info = request(go_proxy_url(metadata, metadata["tag"] + ".info"), missing=True)
              if info is not None:
                  require(info.get("Version") == metadata["tag"], "Go proxy returned another version")
                  require(info.get("Origin", {}).get("Hash") == metadata["sha"], "Go proxy has different or unverifiable source commit; never move a published tag")
              return info


          def publish():
              kind = os.environ["KIND"]
              archive = Path(os.environ["RUNNER_TEMP"]) / "incoming" / ("release-" + kind + ".zip")
              dest = Path(os.environ["RUNNER_TEMP"]) / "publish"
              dest.mkdir()
              with zipfile.ZipFile(archive) as zipped:
                  names = zipped.namelist()
                  require(len(names) == len(set(names)) and set(names).issubset({"metadata.json", "notes.md", "package.tgz", "package.crate", "upload.bin"}), "Unexpected artifact paths")
                  zipped.extractall(dest)
              os.chdir(dest)
              metadata = check_bundle(dest, kind, os.environ["GITHUB_SHA"], os.environ["VERSION"])
              assets = incoming_assets(archive.parent / "release-assets", metadata, kind)
              name = metadata["name"]
              owner = os.environ["GITHUB_REPOSITORY"].split("/")[0].lower()
              if kind == "npm":
                  require(re.fullmatch(r"@" + re.escape(owner) + r"/[a-z0-9][a-z0-9._-]*", name), "Invalid npm name")
                  with tarfile.open("package.tgz", "r:gz") as tar:
                      package = json.loads(tar.extractfile("package/package.json").read())
                  require(package["name"] == name and package["version"] == metadata["version"], "npm archive identity mismatch")
                  check_npm_repository(package)
                  require(not package.get("publishConfig") or package["publishConfig"] == {"access": "public"}, "npm archive overrides publishing policy")
              elif kind == "rust":
                  require(re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]*", name), "Invalid crate name")
              else:
                  major = int(metadata["version"].split(".")[0])
                  expected = "github.com/" + os.environ["GITHUB_REPOSITORY"] + (f"/v{major}" if major >= 2 else "")
                  require(kind == "go" and name == expected, "Invalid Go module identity")
              commit = tag_commit(metadata["tag"])
              require(commit is None or commit == metadata["sha"], "Version tag already points elsewhere")
              if kind == "npm":
                  # Detect a public-registry conflict before mutating GitHub Packages.
                  if not registry_matches(metadata, "https://registry.npmjs.org"):
                      check_npm_channel(metadata, "https://registry.npmjs.org")
                  npm_publish(metadata, "https://npm.pkg.github.com", os.environ["GH_TOKEN"])
              elif kind == "rust":
                  cargo_matches(metadata)
              elif commit is not None or go_proxy_known(metadata):
                  go_proxy_info(metadata)
              ensure_github_release(metadata, archive, assets)
              if kind == "npm":
                  npm_publish(metadata, "https://registry.npmjs.org")
              elif kind == "rust":
                  cargo_publish(metadata)
              else:
                  env = os.environ.copy()
                  env.update(GOPROXY="https://proxy.golang.org", GOSUMDB="sum.golang.org", GOPRIVATE="", GONOPROXY="", GONOSUMDB="", GOWORK="off", GOMODCACHE=str(dest / "gomodcache"))
                  for attempt in range(12):
                      result = subprocess.run(["go", "mod", "download", "-json", name + "@" + metadata["tag"]], env=env, capture_output=True, text=True)
                      if result.returncode == 0:
                          info = json.loads(result.stdout)
                          require(info.get("Version") == metadata["tag"] and info.get("Sum") and info.get("GoModSum"), "Proxy response missing version/checksums")
                          require(go_proxy_info(metadata) is not None, "Go proxy has no verifiable release metadata")
                          print("Go module is available through proxy.golang.org with checksum verification")
                          return
                      if attempt < 11:
                          time.sleep(10)
                  raise RuntimeError("Tag/release exists, but Go proxy availability is not confirmed. Retry later; never move the tag.")


          if __name__ == "__main__":
              publish()
          PY
