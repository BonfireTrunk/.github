name: maven-build

# Reusable build for BonfireTrunk Maven libraries, called from each library's
# build.yml on pull requests. Runs with a read-only token and no secrets, so a
# contributor's code cannot publish anything or reach the release keys.
on:
  workflow_call:
    inputs:
      maven-args:
        description: Arguments passed to ./mvnw after -B -ntp
        type: string
        default: verify

permissions: {}

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        env:
          ARGS: ${{ inputs.maven-args }}
        run: ./mvnw -B -ntp $ARGS
